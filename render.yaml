# Render Blueprint untuk KolabKreatif.
# Cara pakai: Render Dashboard → New → Blueprint → pilih repository ini → branch main.
# Blueprint ini membuat 1 Postgres database dan 1 Web Service berbasis Dockerfile.

databases:
  - name: kolabkreatif-db
    plan: free
    region: singapore
    databaseName: kolabkreatif
    user: kolabkreatif

services:
  - type: web
    name: kolabkreatif
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: KolabKreatif
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://kolabkreatif.onrender.com
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_FAKER_LOCALE
        value: en_US
      - key: APP_MAINTENANCE_DRIVER
        value: file
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: kolabkreatif-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_ENCRYPT
        value: "false"
      - key: SESSION_PATH
        value: /
      - key: SESSION_DOMAIN
        value: ""
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: public
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: hello@kolabkreatif.onrender.com
      - key: MAIL_FROM_NAME
        value: KolabKreatif
      - key: VITE_APP_NAME
        value: KolabKreatif
